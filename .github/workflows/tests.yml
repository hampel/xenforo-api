name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix: the floor with the
      # oldest dependencies it claims, the floor with current ones, and the ceiling.
      # Everything between fails only when a corner does.
      matrix:
        include:
          - { php: '8.3', deps: '--prefer-lowest' }
          - { php: '8.3', deps: '' }
          - { php: '8.5', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Two checks here, and they catch different things. This one needs the dev
      # dependencies PRESENT, so it goes first: composer-require-checker maps every symbol
      # src/ uses back to the package that provides it, and a package that is not installed
      # cannot be mapped. It is the only half that sees a TRANSITIVE dependency - one
      # arriving through something we did declare, which survives --no-dev and so reports
      # clean below - and the only half that sees a missing ext-*, which is invisible to
      # static analysis because a function from an absent extension looks exactly like one
      # from core. ext-ctype was undeclared from 0.1.0 to 0.3.0 for precisely that reason,
      # with the check below green on every push.
      - run: composer install --prefer-dist --no-progress

      # Same shape as the phpstan step below, and the same trap: composer -d does not
      # create the directory.
      - run: |
          mkdir -p /tmp/crc
          composer -d /tmp/crc require maglnet/composer-require-checker --no-progress
          /tmp/crc/vendor/bin/composer-require-checker check composer.json

      # Now analyse src/ with the dev dependencies gone, so anything it calls that is not in
      # "require" comes back as not-found. A normal PHPStan run has guzzle and phpunit
      # installed and sees nothing wrong, and the package would fatal for the consumer
      # instead. It matters here more than most - the whole point of this package is that it
      # needs four PSR interfaces and nothing else.
      - run: composer install --no-dev --prefer-dist --no-progress

      # PHPStan is itself a dev dependency, so --no-dev just deleted it. It has to come
      # from outside the package. composer -d does not create the directory, so mkdir
      # first or the step dies with "Invalid working directory specified".
      - run: |
          mkdir -p /tmp/phpstan
          composer -d /tmp/phpstan require phpstan/phpstan --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon,
      # which points at tests/ and can no longer resolve PHPUnit - turning the run into a
      # configuration error while you are trying to read it as a dependency result.
      - run: >
          /tmp/phpstan/vendor/bin/phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
